<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Manifest link karein -->
<link rel="manifest" href="/manifest.json">
<!-- Mobile top bar color -->
<meta name="theme-color" content="#1976d2">
<link rel="apple-touch-icon" href="/icon-192.png">

    <!-- 🔹 Favicon for browsers
    <link rel="icon" type="image/jpeg" sizes="32x32" href="%PUBLIC_URL%/logo2.png" />
    <link rel="icon" type="image/jpeg" sizes="192x192" href="%PUBLIC_URL%/logo2.png" /> -->
    <link rel="icon" type="image/jpeg" sizes="512x512" href="%PUBLIC_URL%/logo2.png" />

    <!-- 🔹 Viewport & theme setup -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Admin Dashboard - React App" />

    <!-- 🔹 Apple Touch Icon (for iOS devices) -->
    <link rel="apple-touch-icon" sizes="512x512" href="%PUBLIC_URL%/logo2.png" />

    <!-- 🔹 Web App Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>Admin Dashboard</title>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').then((registration) => {
        console.log('Service Worker registered successfully');
      }).catch((error) => {
        console.log('Service Worker registration failed:', error);
      });
    });
  }
</script>
  </body>
</html>
